<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대한산업보건협회 - 데이터 센터</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>
    
    <!-- Lucide Icons Fix: UMD 빌드에서 소문자 react 전역 변수를 찾지 못하는 문제 해결 -->
    <script>window.react = window.React;</script>
    
    <!-- Lucide Icons (React version - 안정적인 버전으로 교체) -->
    <script src="https://unpkg.com/lucide-react@0.284.0/dist/umd/lucide-react.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Animation Utilities */
        .animate-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-4px, 0, 0); } 40%, 60% { transform: translate3d(4px, 0, 0); } }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 overflow-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;
        
        const lucideIcons = window.lucide || window.LucideReact || window.lucideReact || {};
        
        // 아이콘이 없을 경우 앱이 멈추지 않도록 대체(Fallback) 블록을 반환하는 함수
        const getIcon = (name) => lucideIcons[name] || (() => React.createElement('div', { className: 'w-4 h-4 bg-gray-300 rounded-sm inline-block' }));

        const Folder = getIcon('Folder');
        const FileText = getIcon('FileText');
        const Upload = getIcon('Upload');
        const ShieldCheck = getIcon('ShieldCheck');
        const Users = getIcon('Users');
        const Search = getIcon('Search');
        const LogOut = getIcon('LogOut');
        const AlertTriangle = getIcon('AlertTriangle');
        const Home = getIcon('Home');
        const ArrowLeft = getIcon('ArrowLeft');
        const Lock = getIcon('Lock');
        const Key = getIcon('Key');
        const CheckCircle = getIcon('CheckCircle');
        const X = getIcon('X');
        const Share2 = getIcon('Share2');
        const Send = getIcon('Send');
        const UploadCloud = getIcon('UploadCloud');
        const Database = getIcon('Database');
        const UserPlus = getIcon('UserPlus');
        const HardDrive = getIcon('HardDrive');
        const Server = getIcon('Server');
        const Download = getIcon('Download');
        const Trash2 = getIcon('Trash2');
        const Edit2 = getIcon('Edit2');
        const FileDown = getIcon('FileDown');
        const QrCode = getIcon('QrCode');
        const Plus = getIcon('Plus');

        const generateEnterpriseDatabase = (count = 1) => {
            const db = {};
            for (let i = 1; i <= count; i++) {
                const bizNum = i === 1 ? "0000000000" : `12345${String(i).padStart(5, '0')}`;
                const companyId = bizNum;

                db[companyId] = {
                    id: companyId,
                    name: i === 1 ? "(주)에이화학 (테스트)" : `대한안전회원사 ${i}호`,
                    authInfo: { businessNumber: bizNum, email: i === 1 ? "test@test.com" : "" },
                    stats: { totalFiles: 2, loginCount: 0, lastUpdated: new Date().toISOString().split('T')[0] },
                    folders: [
                        { id: "f_work_env", name: "작업환경측정 보고서", icon: FileText, color: "text-blue-600" },
                        { id: "f_muscle", name: "근골격계 부담작업 보고서", icon: Users, color: "text-indigo-600" },
                    ],
                    files: {
                        "f_work_env": [{ id: `wenv_1`, name: `2025년 하반기 작업환경측정 결과.pdf`, date: "2026-01-10", size: "3.2 MB", author: "경남지역본부", url: "#" }],
                        "f_muscle": [{ id: `mus_1`, name: `근골격계 유해요인조사 결과서.pdf`, date: "2026-01-15", size: "1.8 MB", author: "경남지역본부", url: "#" }]
                    },
                    msdsProcesses: [{ id: "proc_base", name: "세척공정" }],
                    msdsFiles: { "proc_base": [] }
                };
            }
            return db;
        };

        const LoginScreen = ({ db, setCurrentUser, setAppState, showToast, setAccessLogs }) => {
            const [loginType, setLoginType] = useState('COMPANY'); 
            const [bizNum, setBizNum] = useState("");
            const [email, setEmail] = useState("");
            const [managerName, setManagerName] = useState("");
            const [adminId, setAdminId] = useState("");
            const [adminPw, setAdminPw] = useState("");
            const [error, setError] = useState("");

            const handleCompanyLogin = (e) => {
                e.preventDefault();
                setError("");
                
                const cleanBizNum = bizNum.replace(/[^0-9]/g, '');
                const company = db[cleanBizNum]; 
                if (company) {
                    if (!managerName.trim()) {
                        setError("담당자명을 입력해주세요.");
                        return;
                    }
                    if (!email.trim() || !email.includes('@')) {
                        setError("유효한 담당자 이메일을 입력해주세요.");
                        return;
                    }
                    company.authInfo.email = email; 
                    company.authInfo.managerName = managerName;
                    
                    company.stats.loginCount = (company.stats.loginCount || 0) + 1;
                    
                    // 개별 접속 로그(Log) 기록 추가
                    setAccessLogs(prev => [{
                        id: `log_${Date.now()}_${Math.random().toString(36).substr(2,9)}`,
                        companyName: company.name,
                        bizNum: company.id,
                        managerName: managerName,
                        email: email,
                        timestamp: new Date().toLocaleString('ko-KR')
                    }, ...prev]);

                    setCurrentUser(company);
                    setAppState('COMPANY');
                    showToast(`[${company.name}] 회원사 전용 스페이스에 접속했습니다.`);
                } else {
                    setError("등록되지 않은 사업자등록번호입니다.");
                }
            };

            const handleAdminLogin = (e) => {
                e.preventDefault();
                setError("");
                if (adminId === 'aniag0000' && adminPw === 'wjdwodyd21') {
                    setCurrentUser({ role: 'ADMIN', name: '시스템 관리자' });
                    setAppState('ADMIN');
                    showToast("관리자 시스템에 진입했습니다.");
                } else {
                    setError("관리자 계정 정보가 일치하지 않습니다.");
                }
            };

            return (
                <div className="min-h-screen bg-gray-50 flex items-center justify-center p-4">
                    <div className="max-w-4xl w-full grid grid-cols-1 md:grid-cols-2 bg-white rounded-3xl shadow-2xl overflow-hidden border border-gray-200">
                        <div className="bg-[#0b2b5e] p-12 text-white flex flex-col justify-between relative">
                            <div className="absolute inset-0 opacity-10 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]"></div>
                            <div className="relative z-10">
                                <ShieldCheck size={56} className="mb-6 text-blue-400" />
                                <h1 className="text-3xl font-extrabold tracking-tight mb-4">경남지역본부<br/>산업보건 데이터 센터</h1>
                                <p className="text-blue-200 text-lg leading-relaxed">
                                    회원사의 소중한 보건 데이터를<br/>
                                    안전하게 보호하고 관리하는<br/>
                                    프라이빗 클라우드 시스템입니다.
                                </p>
                            </div>
                        </div>

                        <div className="p-12 flex flex-col justify-center">
                            <div className="flex bg-gray-100 rounded-xl p-1 mb-8">
                                <button onClick={() => { setLoginType('COMPANY'); setError(''); }} className={`flex-1 py-3 text-sm font-bold rounded-lg transition-all ${loginType === 'COMPANY' ? 'bg-white text-[#0b2b5e] shadow' : 'text-gray-500 hover:text-gray-700'}`}>회원사 접속</button>
                                <button onClick={() => { setLoginType('ADMIN'); setError(''); }} className={`flex-1 py-3 text-sm font-bold rounded-lg transition-all ${loginType === 'ADMIN' ? 'bg-white text-[#0b2b5e] shadow' : 'text-gray-500 hover:text-gray-700'}`}>시스템 관리자</button>
                            </div>

                            <h2 className="text-2xl font-extrabold text-gray-900 mb-2">
                                {loginType === 'COMPANY' ? '자료실 접속' : '관리자 콘솔'}
                            </h2>
                            <p className="text-gray-500 text-sm mb-8">
                                {loginType === 'COMPANY' ? '부여받은 사업자등록번호(숫자)와 담당자 이메일을 입력해주세요.' : '플랫폼 전체 데이터를 통제하는 관리 시스템입니다.'}
                            </p>

                            <form onSubmit={loginType === 'COMPANY' ? handleCompanyLogin : handleAdminLogin} className="space-y-4">
                                {loginType === 'COMPANY' ? (
                                    <>
                                        <div>
                                            <label className="block text-sm font-bold text-gray-700 mb-1">사업자등록번호</label>
                                            <input type="text" value={bizNum} onChange={(e) => setBizNum(e.target.value.replace(/[^0-9]/g, ''))} placeholder="예: 0123456789" className="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-[#0b2b5e] font-mono" required maxLength={10} />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-bold text-gray-700 mb-1">담당자명</label>
                                            <input type="text" value={managerName} onChange={(e) => setManagerName(e.target.value)} placeholder="예: 홍길동" className="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-[#0b2b5e]" required />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-bold text-gray-700 mb-1">담당자 이메일</label>
                                            <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} placeholder="예: manager@company.com" className="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-[#0b2b5e]" required />
                                        </div>
                                    </>
                                ) : (
                                    <>
                                        <div>
                                            <label className="block text-sm font-bold text-gray-700 mb-1">관리자 ID</label>
                                            <input type="text" value={adminId} onChange={(e) => setAdminId(e.target.value)} className="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-[#0b2b5e]" required />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-bold text-gray-700 mb-1">비밀번호</label>
                                            <input type="password" value={adminPw} onChange={(e) => setAdminPw(e.target.value)} className="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-[#0b2b5e]" required />
                                        </div>
                                    </>
                                )}

                                {error && (
                                    <div className="bg-red-50 text-red-600 p-3 rounded-xl text-sm font-bold flex items-center gap-2 animate-in shake">
                                        <X size={16} /> <p>{error}</p>
                                    </div>
                                )}

                                <button type="submit" className="w-full bg-[#0b2b5e] hover:bg-blue-900 text-white font-bold text-lg py-4 px-4 rounded-xl flex items-center justify-center gap-2 transition-transform active:scale-95 mt-2">
                                    {loginType === 'COMPANY' ? <><Lock size={20}/> 자료실 접속</> : <><Server size={20}/> 시스템 관리 진입</>}
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            );
        };

        const AdminDashboardView = ({ companyList }) => (
            <div className="animate-in slide-in-from-bottom-4">
                <h2 className="text-3xl font-extrabold text-gray-900 mb-8">산업보건 플랫폼 통합 현황</h2>
                <div className="grid grid-cols-3 gap-6 mb-10">
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 flex items-center justify-between">
                        <div>
                            <p className="text-gray-500 font-bold mb-1">등록된 총 회원사</p>
                            <p className="text-4xl font-black text-gray-900">{companyList.length}</p>
                        </div>
                        <div className="w-14 h-14 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center"><Users size={28}/></div>
                    </div>
                </div>
            </div>
        );

        const AdminRegisterView = ({ db, handleUpdateDb, showToast }) => {
            const [regType, setRegType] = useState('SINGLE');
            const [newCompName, setNewCompName] = useState("");
            const [newCompBiz, setNewCompBiz] = useState("");
            const [excelData, setExcelData] = useState("");

            const processNewCompany = (biz, name, currentDb) => {
                const cleanBiz = biz.replace(/[^0-9]/g, '');
                if(currentDb[cleanBiz]) return null;
                return {
                    id: cleanBiz,
                    name: name.trim(),
                    authInfo: { businessNumber: cleanBiz, email: "" },
                    stats: { totalFiles: 0, loginCount: 0, lastUpdated: new Date().toISOString().split('T')[0] },
                    folders: [
                        { id: "f_work_env", name: "작업환경측정 보고서", icon: FileText, color: "text-blue-600" },
                        { id: "f_muscle", name: "근골격계 부담작업 보고서", icon: Users, color: "text-indigo-600" },
                    ],
                    files: {},
                    msdsProcesses: [{ id: "proc_base", name: "세척공정" }],
                    msdsFiles: { "proc_base": [] }
                };
            };

            const handleSingleReg = (e) => {
                e.preventDefault();
                const cleanBiz = newCompBiz.replace(/[^0-9]/g, '');
                if (!cleanBiz || !newCompName) return;
                if (db[cleanBiz]) return showToast("이미 존재하는 사업자번호입니다.");

                const newCompany = processNewCompany(cleanBiz, newCompName, db);
                handleUpdateDb({ ...db, [cleanBiz]: newCompany });
                setNewCompName(""); setNewCompBiz("");
                showToast(`[${newCompName}] 회원사 계정 자동 생성 완료!`);
            };

            const handleExcelReg = (e) => {
                e.preventDefault();
                if(!excelData.trim()) return;
                const lines = excelData.split('\n');
                let successCount = 0; let failCount = 0;
                const newDb = { ...db };

                lines.forEach(line => {
                    const parts = line.split(/\t|,| /).filter(Boolean);
                    if(parts.length >= 2) {
                        const biz = parts[0]; const name = parts.slice(1).join(' ');
                        const newComp = processNewCompany(biz, name, newDb);
                        if(newComp) { newDb[newComp.id] = newComp; successCount++; } else failCount++;
                    }
                });

                if (successCount > 0) {
                    handleUpdateDb(newDb); setExcelData("");
                    showToast(`엑셀 일괄 연동 완료! (성공: ${successCount}건, 제외: ${failCount}건)`);
                }
            };

            return (
                <div className="animate-in slide-in-from-bottom-4 max-w-4xl">
                    <h2 className="text-3xl font-extrabold text-gray-900 mb-8">신규 회원사 권한 생성</h2>
                    <div className="bg-white rounded-3xl shadow-sm border border-gray-200 overflow-hidden">
                        <div className="flex border-b border-gray-200 bg-gray-50">
                            <button onClick={()=>setRegType('SINGLE')} className={`flex-1 py-4 font-bold ${regType==='SINGLE'?'bg-white text-blue-600 border-b-2 border-blue-600':'text-gray-500'}`}>단일 등록</button>
                            <button onClick={()=>setRegType('EXCEL')} className={`flex-1 py-4 font-bold ${regType==='EXCEL'?'bg-white text-green-600 border-b-2 border-green-600':'text-gray-500'}`}>엑셀 일괄 연동</button>
                        </div>
                        <div className="p-8">
                            {regType === 'SINGLE' ? (
                                <form onSubmit={handleSingleReg} className="space-y-4 max-w-xl">
                                    <input type="text" value={newCompName} onChange={e => setNewCompName(e.target.value)} required className="w-full p-4 bg-gray-50 border border-gray-200 rounded-xl outline-none" placeholder="회사명 입력"/>
                                    <input type="text" value={newCompBiz} onChange={e => setNewCompBiz(e.target.value.replace(/[^0-9]/g, ''))} required className="w-full p-4 bg-gray-50 border border-gray-200 rounded-xl outline-none" placeholder="사업자등록번호 (숫자만)" maxLength={10}/>
                                    <button type="submit" className="w-full py-4 bg-[#0b2b5e] text-white font-bold rounded-xl">전용 스페이스 생성</button>
                                </form>
                            ) : (
                                <form onSubmit={handleExcelReg} className="space-y-4">
                                    <textarea value={excelData} onChange={e => setExcelData(e.target.value)} required className="w-full h-48 p-4 bg-gray-50 border border-gray-200 rounded-xl outline-none text-sm" placeholder="사업자번호 회사명\n1234567890 한국산업..."></textarea>
                                    <button type="submit" className="w-full py-4 bg-green-600 text-white font-bold rounded-xl">엑셀 파싱 및 일괄 생성</button>
                                </form>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const AdminUploadView = ({ db, handleUpdateDb, showToast }) => {
            const [searchTerm, setSearchTerm] = useState("");
            const [isSearchFocused, setIsSearchFocused] = useState(false);
            const [selectedCompId, setSelectedCompId] = useState(null);
            const [newFolderName, setNewFolderName] = useState("");
            const [editingFolderId, setEditingFolderId] = useState(null);
            const [editFolderName, setEditFolderName] = useState("");
            const [uploadTargetFolder, setUploadTargetFolder] = useState("");
            const [uploadFile, setUploadFile] = useState(null);
            
            // 파일 수정/삭제를 위한 상태 추가
            const [editingFileId, setEditingFileId] = useState(null);
            const [editFileName, setEditFileName] = useState("");

            const companyList = Object.values(db);
            const filteredComps = useMemo(() => {
                if(!searchTerm.trim()) return companyList.slice(0, 50); // 검색어가 없어도 기본 50개 리스트 노출
                return companyList.filter(c => c.name.includes(searchTerm) || c.authInfo.businessNumber.includes(searchTerm)).slice(0, 50);
            }, [searchTerm, companyList]);

            const selectedComp = selectedCompId ? db[selectedCompId] : null;

            const handleAddFolder = () => {
                if(!newFolderName.trim() || !selectedComp) return;
                const newId = `f_${Date.now()}`;
                const updatedDb = { ...db };
                updatedDb[selectedComp.id].folders.push({ id: newId, name: newFolderName, icon: Folder, color: "text-slate-600" });
                if(!updatedDb[selectedComp.id].files[newId]) updatedDb[selectedComp.id].files[newId] = [];
                handleUpdateDb(updatedDb); setNewFolderName(""); showToast("새 폴더가 추가되었습니다.");
            };

            const handleDeleteFolder = (folderId) => {
                if(!selectedComp) return;
                const updatedDb = { ...db };
                updatedDb[selectedComp.id].folders = updatedDb[selectedComp.id].folders.filter(f => f.id !== folderId);
                delete updatedDb[selectedComp.id].files[folderId];
                handleUpdateDb(updatedDb); showToast("폴더가 삭제되었습니다.");
            };

            const handleSaveEditFolder = (folderId) => {
                if(!selectedComp || !editFolderName.trim()) return;
                const updatedDb = { ...db };
                updatedDb[selectedComp.id].folders = updatedDb[selectedComp.id].folders.map(f => f.id === folderId ? { ...f, name: editFolderName } : f);
                handleUpdateDb(updatedDb); setEditingFolderId(null); showToast("폴더 이름이 변경되었습니다.");
            };

            // 개별 파일 삭제 로직 추가
            const handleDeleteFile = (folderId, fileId) => {
                if(!selectedComp) return;
                const updatedDb = { ...db };
                updatedDb[selectedComp.id].files[folderId] = updatedDb[selectedComp.id].files[folderId].filter(f => f.id !== fileId);
                // 회원사의 전체 파일 수 업데이트 (0 미만 방지)
                updatedDb[selectedComp.id].stats.totalFiles = Math.max(0, updatedDb[selectedComp.id].stats.totalFiles - 1);
                handleUpdateDb(updatedDb); showToast("배포된 파일이 삭제되었습니다.");
            };

            // 개별 파일 이름 수정 로직 추가
            const handleSaveEditFile = (folderId, fileId) => {
                if(!selectedComp || !editFileName.trim()) return;
                const updatedDb = { ...db };
                const fileIndex = updatedDb[selectedComp.id].files[folderId].findIndex(f => f.id === fileId);
                if(fileIndex > -1) {
                    updatedDb[selectedComp.id].files[folderId][fileIndex].name = editFileName;
                }
                handleUpdateDb(updatedDb); setEditingFileId(null); showToast("파일명이 성공적으로 변경되었습니다.");
            };

            const handleRealFileUpload = (e) => {
                e.preventDefault();
                if(!selectedComp || !uploadTargetFolder || !uploadFile) return;
                const updatedDb = { ...db };
                if(!updatedDb[selectedComp.id].files[uploadTargetFolder]) updatedDb[selectedComp.id].files[uploadTargetFolder] = [];
                
                updatedDb[selectedComp.id].files[uploadTargetFolder].push({
                    id: `file_${Date.now()}`, name: uploadFile.name, date: new Date().toISOString().split('T')[0], size: `${(uploadFile.size / 1024 / 1024).toFixed(2)} MB`, author: "시스템 관리자"
                });

                        />
                        {isSearchFocused && (

                                <div className="bg-white border border-gray-200 rounded-xl shadow-xl max-h-60 overflow-y-auto">
                                    {filteredComps.map(c => (

                                            <span className="font-bold">{c.name}</span><span className="text-sm font-mono text-gray-500">{c.authInfo.businessNumber}</span>

                            </div>

                    {selectedComp && (
                        <div className="grid grid-cols-1 lg:grid-cols-5 gap-8">
                            <div className="lg:col-span-3 bg-white p-6 rounded-3xl border border-blue-200 shadow-sm flex flex-col">
                                <h3 className="font-extrabold text-xl text-blue-900 mb-4 pb-2 border-b">1. 폴더 및 배포된 파일 관리 [{selectedComp.name}]</h3>
                                <div className="flex gap-2 mb-4">
                                    <input type="text" value={newFolderName} onChange={e=>setNewFolderName(e.target.value)} placeholder="새 문서 폴더명" className="flex-1 border border-gray-300 rounded-lg p-2.5 outline-none text-sm" />
                                    <button onClick={handleAddFolder} className="bg-[#0b2b5e] text-white px-4 rounded-lg text-sm font-bold">폴더 추가</button>
                                </div>
                                <div className="space-y-3 max-h-[650px] overflow-y-auto pr-2 custom-scrollbar">
                                    {selectedComp.folders.map(f => (
                                        <div key={f.id} className="border border-gray-200 rounded-xl overflow-hidden shadow-sm">
                                            <div className="flex justify-between py-2.5 px-3 bg-gray-50 border-b border-gray-200 group">
                                                {editingFolderId === f.id ? (
                                                    <div className="flex gap-2 w-full">
                                                        <input type="text" value={editFolderName} onChange={e=>setEditFolderName(e.target.value)} className="flex-1 border border-blue-300 rounded px-2 py-1 outline-none text-sm" autoFocus />
                                                        <button onClick={()=>handleSaveEditFolder(f.id)} className="bg-blue-600 text-white px-3 rounded text-sm font-bold">저장</button>
                                                    </div>
                                                ) : (
                                                    <>
                                                        <div className="flex items-center gap-2 font-bold text-gray-700 text-sm"><f.icon size={16} className="text-slate-500" /> {f.name}</div>
                                                        <div className="hidden group-hover:flex gap-2 items-center">
                                                            <button onClick={()=>{setEditingFolderId(f.id); setEditFolderName(f.name);}} className="text-gray-400 hover:text-blue-600"><Edit2 size={14}/></button>
                                                            <button onClick={()=>handleDeleteFolder(f.id)} className="text-gray-400 hover:text-red-600"><Trash2 size={14}/></button>
                                                        </div>
                                                    </>
                                                )}
                                            </div>
                                            
                                            {/* 폴더 내 배포된 파일 현황 고밀도 리스트 */}
                                            <div className="bg-white">
                                                {(!selectedComp.files[f.id] || selectedComp.files[f.id].length === 0) ? (
                                                    <div className="text-xs text-gray-400 p-3 text-center bg-gray-50/50">배포된 파일이 없습니다. 우측에서 업로드해주세요.</div>
                                                ) : (
                                                    <ul className="divide-y divide-gray-100">
                                                        {selectedComp.files[f.id].map(file => (
                                                            <li key={file.id} className="flex justify-between items-center py-1.5 px-3 hover:bg-blue-50/50 group/file transition-colors">
                                                                {editingFileId === file.id ? (
                                                                    <div className="flex gap-2 w-full items-center">
                                                                        <FileText size={14} className="text-[#0b2b5e] shrink-0" />
                                                                        <input type="text" value={editFileName} onChange={e=>setEditFileName(e.target.value)} className="flex-1 border border-blue-300 rounded px-1.5 py-0.5 outline-none text-xs" autoFocus />
                                                                        <button onClick={()=>handleSaveEditFile(f.id, file.id)} className="bg-green-600 text-white px-2 py-0.5 rounded text-xs font-bold">저장</button>
                                                                        <button onClick={()=>setEditingFileId(null)} className="bg-gray-400 hover:bg-gray-500 text-white px-2 py-0.5 rounded text-xs font-bold">취소</button>
                                                                    </div>
                                                                ) : (
                                                                    <>
                                                                        <div className="flex items-center gap-2 text-gray-700 text-sm w-[85%]">
                                                                            <FileText size={14} className="text-[#0b2b5e] shrink-0" />
                                                                            <span className="truncate font-medium">{file.name}</span>
                                                                            <span className="text-[11px] text-gray-400 shrink-0 bg-gray-100 px-1.5 py-0.5 rounded font-mono tracking-tighter">({file.size})</span>
                                                                        </div>
                                                                        <div className="hidden group-hover/file:flex gap-2">
                                                                            <button onClick={()=>{setEditingFileId(file.id); setEditFileName(file.name);}} className="text-gray-400 hover:text-green-600 p-0.5" title="파일명 수정"><Edit2 size={14}/></button>
                                                                            <button onClick={()=>handleDeleteFile(f.id, file.id)} className="text-gray-400 hover:text-red-600 p-0.5" title="파일 삭제"><Trash2 size={14}/></button>
                                                                        </div>
                                                                    </>
                                                                )}
                                                            </li>
                                                        ))}
                                                    </ul>
                                                )}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                            <div className="lg:col-span-2 bg-white p-6 rounded-3xl border border-emerald-200 shadow-sm h-fit sticky top-0">

                                    <select value={uploadTargetFolder} onChange={e => setUploadTargetFolder(e.target.value)} required className="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl outline-none">
                                        <option value="">대상 폴더 선택</option>
                                        {selectedComp.folders.map(f => <option key={f.id} value={f.id}>{f.name}</option>)}
                                    </select>
                                    <input type="file" id="admin-file-upload" onChange={e => setUploadFile(e.target.files[0])} required className="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl text-sm" />
                                    <button type="submit" className="w-full py-4 bg-emerald-600 text-white font-bold rounded-xl flex justify-center gap-2">
                                        <Upload size={20} /> 업로드 실행
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const AdminManageView = ({ accessLogs, setAccessLogs, showToast }) => {
            const [checkedLogs, setCheckedLogs] = useState([]);

            const handleToggleCheck = (id) => {
                if(checkedLogs.includes(id)) setCheckedLogs(checkedLogs.filter(l => l !== id));
                else setCheckedLogs([...checkedLogs, id]);
            };

            const handleDeleteSelected = () => {
                if(checkedLogs.length === 0) return;
                setAccessLogs(prev => prev.filter(log => !checkedLogs.includes(log.id))); 
                setCheckedLogs([]); 
                showToast(`선택된 접속 기록이 파기되었습니다.`);
            };

            const handleDeleteSingle = (id) => {
                setAccessLogs(prev => prev.filter(log => log.id !== id));
                showToast(`해당 접속 기록이 개별 삭제되었습니다.`);
            };

            const handleDownloadExcel = () => {
                let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
                csvContent += "회사명,사업자등록번호,담당자명,이메일주소,접속날짜 및 시간\n";
                accessLogs.forEach(log => {
                    csvContent += `"${log.companyName}","${log.bizNum}","${log.managerName || ''}","${log.email}","${log.timestamp}"\n`;
                });
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `경남지역본부_회원사_접속_현황.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast("접속 현황 엑셀 다운로드가 완료되었습니다.");
            };

            return (
                <div className="animate-in slide-in-from-bottom-4">
                    <div className="flex justify-between items-end mb-8">
                        <div>
                            <h2 className="text-3xl font-extrabold text-gray-900">회원사 접속 현황 관리</h2>
                            <p className="text-gray-500 mt-2">개별 회원의 로그인 접속 기록(Log)을 확인하고 엑셀로 저장할 수 있습니다.</p>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={handleDownloadExcel} className="bg-green-600 hover:bg-green-700 text-white px-5 py-2.5 rounded-xl font-bold flex items-center gap-2 transition-colors">
                                <FileDown size={18}/> 엑셀 전체 저장
                            </button>
                            <button onClick={handleDeleteSelected} className="bg-red-600 hover:bg-red-700 text-white px-5 py-2.5 rounded-xl font-bold transition-colors">선택 삭제</button>
                        </div>
                    </div>
                    <div className="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden h-[600px] overflow-y-auto">
                        <table className="w-full text-left">
                            <thead className="bg-gray-50 sticky top-0 border-b z-10">
                                <tr className="text-sm text-gray-500 font-bold">
                                    <th className="py-3 px-4 w-12 text-center">선택</th>
                                    <th className="py-3 px-4">회사명</th>
                                    <th className="py-3 px-4">사업자번호</th>
                                    <th className="py-3 px-4">담당자명</th>
                                    <th className="py-3 px-4">이메일주소</th>
                                    <th className="py-3 px-4">접속날짜 및 시간</th>
                                    <th className="py-3 px-4 text-center">관리</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-gray-100">
                                {accessLogs.length === 0 ? (
                                    <tr>
                                        <td colSpan="6" className="text-center py-16 text-gray-400">
                                            <Users size={48} className="mx-auto mb-4 text-gray-300" />
                                            아직 회원의 접속 기록이 없습니다.
                                        </td>
                                    </tr>
                                ) : (
                                    accessLogs.map(log => (
                                        <tr key={log.id} className="hover:bg-blue-50/50 transition-colors">
                                            <td className="py-3 px-4 text-center">
                                                <input type="checkbox" checked={checkedLogs.includes(log.id)} onChange={() => handleToggleCheck(log.id)} className="w-4 h-4 cursor-pointer" />
                                            </td>
                                            <td className="py-3 px-4 font-bold text-gray-800">{log.companyName}</td>
                                            <td className="py-3 px-4 font-mono text-sm text-gray-600">{log.bizNum}</td>
                                            <td className="py-3 px-4 font-bold text-gray-700">{log.managerName}</td>
                                            <td className="py-3 px-4 text-gray-600">{log.email}</td>
                                            <td className="py-3 px-4 text-sm text-gray-500">{log.timestamp}</td>
                                            <td className="py-3 px-4 text-center">
                                                <button onClick={() => handleDeleteSingle(log.id)} className="text-gray-400 hover:text-red-600 bg-gray-50 hover:bg-red-50 p-2 rounded-lg transition-colors">
                                                    <Trash2 size={16} />
                                                </button>
                                            </td>
                                        </tr>
                                    ))
                                )}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        const CompanyMsdsView = ({ companyData, handleUpdateCompany, showToast }) => {
            const [activeProcId, setActiveProcId] = useState(companyData.msdsProcesses?.[0]?.id || null);
            const [newProcName, setNewProcName] = useState("");
            const [editingProcId, setEditingProcId] = useState(null);
            const [editProcName, setEditProcName] = useState("");
            const [showQrModal, setShowQrModal] = useState(false);
            const [uploadFile, setUploadFile] = useState(null);

            const processes = companyData.msdsProcesses || [];
            const files = activeProcId ? (companyData.msdsFiles?.[activeProcId] || []) : [];

            const handleAddProcess = () => {
                if (!newProcName.trim()) return;
                const newId = `proc_${Date.now()}`;
                const updated = { ...companyData };
                updated.msdsProcesses = [...(updated.msdsProcesses || []), { id: newId, name: newProcName }];
                updated.msdsFiles = { ...updated.msdsFiles, [newId]: [] };
                handleUpdateCompany(updated);
                setNewProcName("");
                setActiveProcId(newId);
                showToast("새 공정이 추가되었습니다.");
            };

            const handleSaveEditProc = (procId) => {
                if (!editProcName.trim()) return;
                const updated = { ...companyData };
                updated.msdsProcesses = updated.msdsProcesses.map(p => p.id === procId ? { ...p, name: editProcName } : p);
                handleUpdateCompany(updated);
                setEditingProcId(null);
                showToast("공정명이 수정되었습니다.");
            };

            const handleUploadMsds = (e) => {
                e.preventDefault();
                if (!uploadFile || !activeProcId) return;
                const updated = { ...companyData };
                updated.msdsFiles[activeProcId] = [...(updated.msdsFiles[activeProcId] || []), { id: `m_${Date.now()}`, name: uploadFile.name, date: new Date().toISOString().split('T')[0] }];
                handleUpdateCompany(updated);
                setUploadFile(null);
                const fileInput = document.getElementById('msds-file-input');
                if(fileInput) fileInput.value = "";
                showToast("MSDS 파일 업로드 완료");
            };

            const handlePrintQr = () => {
                const printWindow = window.open('', '_blank');
                // 백틱(템플릿 리터럴) 내에서의 복잡한 스크립트 중첩을 피해 안전하게 문자열로 병합
                const htmlContent = [
                    '<html><head><title>QR 포스터 인쇄</title><style>',
                    'body { font-family: "Inter", sans-serif; text-align: center; padding: 50px; background-color: #f8fafc; }',
                    '.card { background: white; padding: 40px; border-radius: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: inline-block; }',
                    'img { width: 300px; height: 300px; margin: 0 auto; display: block; border: 1px solid #e2e8f0; border-radius: 12px; padding: 10px; }',
                    'h1 { font-size: 36px; color: #0f172a; margin-bottom: 10px; }',
                    'p { font-size: 24px; color: #0ea5e9; font-weight: bold; margin-top: 30px; }',
                    '</style></head><body>',
                    '<div class="card">',
                    '<h1>[' + companyData.name + '] 안전보건자료</h1>',
                    '<img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https://safety.com/msds/' + companyData.id + '" alt="QR Code" />',
                    '<p>스마트폰 카메라로 스캔하여 MSDS를 확인하세요</p>',
                    '</div>',
                    '</body></html>'
                ].join('');

                printWindow.document.write(htmlContent);
                printWindow.document.close();
                // 브라우저 렌더링 후 인쇄 대화상자 호출
                setTimeout(() => {
                    printWindow.focus();
                    printWindow.print();
                    printWindow.close();
                }, 500);
            };

            return (
                <div className="animate-in slide-in-from-right-8">
                    <div className="flex justify-between items-center mb-8 border-b-2 border-green-200 pb-5">
                        <div>
                            <h2 className="text-3xl font-extrabold text-green-900 flex items-center gap-3"><QrCode size={32}/> MSDS 현장 공유 (QR)</h2>
                            <p className="text-gray-500 mt-2 font-medium">공정별로 폴더를 생성하고 직접 MSDS를 등록하세요.</p>
                        </div>
                        <button onClick={() => setShowQrModal(true)} className="bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-xl font-bold flex items-center gap-2 transition-colors">
                            <QrCode size={20}/> 현장 부착용 QR 발급
                        </button>
                    </div>
                    <div className="grid grid-cols-1 lg:grid-cols-4 gap-8">
                        <div className="col-span-1 bg-white p-6 rounded-2xl border border-gray-200 shadow-sm">
                            <h3 className="font-bold text-gray-800 mb-4 border-b pb-2 flex items-center gap-2"><Folder size={18} className="text-green-500"/> 공정 폴더 관리</h3>
                            <div className="flex gap-2 mb-4">
                                <input type="text" value={newProcName} onChange={e=>setNewProcName(e.target.value)} placeholder="새 공정명" className="w-full border border-gray-300 rounded-lg p-2.5 text-sm outline-none focus:border-green-500"/>
                                <button onClick={handleAddProcess} className="bg-[#0b2b5e] hover:bg-blue-900 text-white p-2.5 rounded-lg transition-colors"><Plus size={18}/></button>
                            </div>
                            <div className="space-y-2">
                                {processes.map(p => (
                                    <div key={p.id} className={`p-3 rounded-xl flex justify-between items-center group transition-colors border ${activeProcId === p.id ? 'bg-green-50 border-green-200 font-bold text-green-900' : 'bg-gray-50 border-gray-100 text-gray-700'}`}>
                                        {editingProcId === p.id ? (
                                            <div className="flex gap-2 w-full">
                                                <input type="text" value={editProcName} onChange={e=>setEditProcName(e.target.value)} className="w-full border border-green-400 rounded p-1 text-sm outline-none" autoFocus />
                                                <button onClick={()=>handleSaveEditProc(p.id)} className="bg-green-600 text-white px-3 py-1 rounded text-xs font-bold">저장</button>
                                            </div>
                                        ) : (
                                            <>
                                                <span onClick={()=>setActiveProcId(p.id)} className="cursor-pointer flex-1 truncate text-sm"><Folder size={16} className={`inline mr-2 ${activeProcId === p.id ? "text-green-600" : "text-gray-400"}`}/> {p.name}</span>
                                                <button onClick={() => { setEditingProcId(p.id); setEditProcName(p.name); }} className="text-gray-400 hover:text-green-600 hidden group-hover:flex p-1"><Edit2 size={14}/></button>
                                            </>
                                        )}
                                    </div>
                                ))}
                            </div>
                        </div>
                        <div className="col-span-3 bg-white p-8 rounded-2xl border border-gray-200 shadow-sm">
                            {activeProcId ? (
                                <>
                                    <div className="flex justify-between items-center mb-6 border-b pb-4">
                                        <h3 className="font-bold text-xl text-gray-800"><span className="text-green-600 bg-green-50 px-3 py-1 rounded-lg mr-2">[{processes.find(p=>p.id===activeProcId)?.name}]</span> 배포용 MSDS</h3>
                                        <form onSubmit={handleUploadMsds} className="flex gap-3 items-center bg-gray-50 p-2 rounded-xl border border-gray-200">
                                            <input id="msds-file-input" type="file" onChange={e=>setUploadFile(e.target.files[0])} required className="text-sm file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-green-100 file:text-green-700 file:font-bold cursor-pointer hover:file:bg-green-200 transition-colors" />
                                            <button type="submit" className="bg-[#0b2b5e] hover:bg-blue-900 text-white px-5 py-2 rounded-lg text-sm font-bold transition-colors">신규 등록</button>
                                        </form>
                                    </div>
                                    <table className="w-full text-left bg-white border border-gray-200 rounded-xl overflow-hidden">
                                        <thead className="bg-gray-50 text-gray-500 text-sm"><tr><th className="py-3 px-6">문서명</th><th className="py-3 px-6">등록 일자</th></tr></thead>
                                        <tbody className="divide-y divide-gray-100">
                                            {files.length === 0 ? (
                                                <tr><td colSpan="2" className="text-center py-10 text-gray-400">등록된 MSDS 파일이 없습니다.</td></tr>
                                            ) : (
                                                files.map(f => (<tr key={f.id} className="hover:bg-green-50/30 transition-colors"><td className="py-4 px-6 font-bold text-gray-800 flex items-center gap-2"><FileText size={16} className="text-green-500"/> {f.name}</td><td className="py-4 px-6 text-sm text-gray-500">{f.date}</td></tr>))
                                            )}
                                        </tbody>
                                    </table>
                                </>
                            ) : (<div className="flex flex-col items-center justify-center h-full text-gray-400 py-20"><Folder size={48} className="mb-4 opacity-50" /><p>좌측에서 공정 폴더를 선택해주세요.</p></div>)}
                        </div>
                    </div>
                    {showQrModal && (
                        <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50 animate-in fade-in">
                            <div className="bg-white p-10 rounded-3xl max-w-sm w-full text-center relative shadow-2xl animate-in zoom-in-95">
                                <button onClick={()=>setShowQrModal(false)} className="absolute top-5 right-5 text-gray-400 hover:text-gray-900 transition-colors"><X size={24}/></button>
                                <h3 className="text-2xl font-extrabold mb-2 text-gray-900">MSDS QR 공유</h3>
                                <p className="text-gray-500 text-sm mb-6">아래 QR을 스캔하면 MSDS를 볼 수 있습니다.</p>
                                <div className="bg-gray-50 p-4 rounded-2xl inline-block mb-6 border border-gray-100">
                                    <img src={`https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://safety.com/msds/${companyData.id}`} alt="QR" className="mx-auto rounded-lg" />
                                </div>
                                <button onClick={handlePrintQr} className="w-full bg-[#0b2b5e] hover:bg-blue-900 text-white py-4 rounded-xl font-bold flex justify-center items-center gap-2 transition-colors">🖨️ 포스터 인쇄하기 (Print)</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const AdminMsdsTestView = ({ showToast }) => {
            const [testCompany, setTestCompany] = useState({
                id: 'admin_test_999',
                name: '경남지역본부 테스트랩',
                msdsProcesses: [{ id: "proc_base_1", name: "세척공정" }],
                msdsFiles: { "proc_base_1": [] }
            });

            return (
                <div className="animate-in slide-in-from-bottom-4">
                    <div className="bg-yellow-50 border border-yellow-200 p-4 rounded-2xl mb-8 text-yellow-800 flex items-center gap-3 font-bold shadow-sm">
                        <AlertTriangle size={24} className="shrink-0 text-yellow-600" />
                        <div>
                            <p className="text-lg">관리자 전용 MSDS QR공유 테스트 환경입니다.</p>
                            <p className="text-sm font-medium text-yellow-700 mt-0.5">이곳에서의 변경사항(업로드/삭제 등)은 실제 회원사 데이터베이스에 영향을 주지 않습니다.</p>
                        </div>
                    </div>
                    <div className="bg-white p-8 rounded-3xl shadow-sm border border-gray-200">
                        <CompanyMsdsView companyData={testCompany} handleUpdateCompany={setTestCompany} showToast={showToast} />
                    </div>
                </div>
            );
        };

        const AdminDashboard = ({ db, handleUpdateDb, handleLogout, showToast, accessLogs, setAccessLogs }) => {
            const [adminMenu, setAdminMenu] = useState('DASHBOARD');
            return (
                <div className="flex h-screen bg-gray-50 w-full animate-in fade-in">
                    <div className="w-72 bg-white border-r border-gray-200 text-gray-700 flex flex-col shadow-sm z-20 relative">
                        <div className="p-6 border-b border-gray-200 bg-gray-50">
                            <div className="flex items-center gap-3 text-[#0b2b5e] mb-1">
                                <Server size={28} />
                                <h1 className="font-extrabold text-xl tracking-tight">Admin Console</h1>
                            </div>
                        </div>
                        <nav className="p-4 space-y-2 flex-1">
                            <button onClick={() => setAdminMenu('DASHBOARD')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold transition-all ${adminMenu === 'DASHBOARD' ? 'bg-[#0b2b5e] text-white' : 'text-gray-600 hover:bg-gray-100'}`}><Database size={18} /> 통합 대시보드</button>
                            <button onClick={() => setAdminMenu('REGISTER')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold transition-all ${adminMenu === 'REGISTER' ? 'bg-[#0b2b5e] text-white' : 'text-gray-600 hover:bg-gray-100'}`}><UserPlus size={18} /> 신규 회원사 등록</button>
                            <button onClick={() => setAdminMenu('UPLOAD')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold transition-all ${adminMenu === 'UPLOAD' ? 'bg-[#0b2b5e] text-white' : 'text-gray-600 hover:bg-gray-100'}`}><UploadCloud size={18} /> 전용 폴더 및 파일 배포</button>
                            <button onClick={() => setAdminMenu('MANAGE')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold transition-all ${adminMenu === 'MANAGE' ? 'bg-[#0b2b5e] text-white' : 'text-gray-600 hover:bg-gray-100'}`}><Users size={18} /> 회원사 접속 현황 관리</button>
                            
                            <div className="my-4 border-t border-gray-100"></div>
                            
                            <button onClick={() => setAdminMenu('MSDS_TEST')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold transition-all ${adminMenu === 'MSDS_TEST' ? 'bg-green-50 text-green-700' : 'text-gray-600 hover:bg-gray-100'}`}><QrCode size={18} /> MSDS 현장 공유 (테스트)</button>
                        </nav>
                        <div className="p-5 border-t border-gray-200 bg-gray-50">
                            <button onClick={handleLogout} className="flex items-center justify-center gap-2 w-full py-3 bg-red-50 text-red-600 hover:bg-red-100 rounded-xl font-bold text-sm transition-colors"><LogOut size={16} /> 로그아웃</button>
                        </div>
                    </div>
                    <div className="flex-1 overflow-y-auto p-10 relative">
                        <div className="max-w-6xl mx-auto">
                            {adminMenu === 'DASHBOARD' && <AdminDashboardView companyList={Object.values(db)} />}
                            {adminMenu === 'REGISTER' && <AdminRegisterView db={db} handleUpdateDb={handleUpdateDb} showToast={showToast} />}
                            {adminMenu === 'UPLOAD' && <AdminUploadView db={db} handleUpdateDb={handleUpdateDb} showToast={showToast} />}
                            {adminMenu === 'MANAGE' && <AdminManageView accessLogs={accessLogs} setAccessLogs={setAccessLogs} showToast={showToast} />}
                            {adminMenu === 'MSDS_TEST' && <AdminMsdsTestView showToast={showToast} />}
                        </div>
                    </div>
                </div>
            );
        };

        const CompanyHome = ({ companyData, setActiveFolderId }) => (
            <div className="animate-in fade-in duration-500">
                <div className="mb-12">
                    <h2 className="text-3xl font-extrabold text-gray-900 tracking-tight flex items-center gap-3">
                        <Lock className="text-[#0b2b5e]"/> 회원사 전용 산업보건 데이터 센터
                    </h2>
                    <p className="text-gray-500 mt-2 text-base font-medium">귀사만의 독립된 보안 공간입니다. 회원사 안전보건관계자 외 접근을 엄격히 금지합니다.</p>
                </div>
                <h3 className="text-xl font-bold text-gray-900 mb-5 flex items-center gap-2 border-b-2 border-blue-100 pb-3">
                    <Folder size={24} className="text-[#0b2b5e]" /> [{companyData.name}] 안전보건폴더
                </h3>
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                    {companyData.folders.map(folder => (
                        <div key={folder.id} onClick={() => setActiveFolderId(folder.id)} className="bg-white border border-gray-200 p-6 rounded-2xl hover:border-[#0b2b5e] hover:shadow-lg transition-all cursor-pointer group">
                            <div className={`w-12 h-12 rounded-xl bg-gray-50 flex items-center justify-center mb-4 group-hover:scale-110 transition-transform ${folder.color}`}><folder.icon size={24} /></div>
                            <h4 className="font-bold text-gray-900 mb-1 text-lg">{folder.name}</h4>
                            <p className="text-sm text-gray-500 font-medium">관리자 배포 문서함</p>
                        </div>
                    ))}
                </div>
            </div>
        );

        const CompanyFolderView = ({ companyData, activeFolderId, setActiveFolderId, showToast }) => {
            const activeFolder = companyData.folders.find(f => f.id === activeFolderId);
            const files = companyData.files[activeFolderId] || [];

            const handleDownload = (file) => {
                const text = `가상의 보안 다운로드 문서입니다.\n\n파일명: ${file.name}\n등록자: ${file.author}`;
                const blob = new Blob([text], { type: 'text/plain' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = url; a.download = file.name.replace('.pdf', '.txt');
                document.body.appendChild(a); a.click(); document.body.removeChild(a); window.URL.revokeObjectURL(url);
                showToast(`[${file.name}] 다운로드 시작`);
            };

            return (
                <div className="animate-in slide-in-from-right-8 duration-300">
                    <button onClick={() => setActiveFolderId(null)} className="mb-6 flex items-center gap-2 text-sm font-bold text-gray-500 hover:text-gray-900"><ArrowLeft size={18} /> 전체 목록으로 돌아가기</button>
                    <div className="mb-8 pb-6 border-b-2 border-gray-100">
                        <h2 className="text-3xl font-extrabold text-gray-900 flex items-center gap-4"><div className={`p-3 rounded-2xl bg-gray-50 border shadow-sm ${activeFolder.color}`}><activeFolder.icon size={32} /></div>{activeFolder.name}</h2>
                    </div>
                    {files.length > 0 ? (
                        <div className="bg-white border border-gray-200 rounded-2xl overflow-hidden shadow-sm">
                            <table className="w-full text-left">
                                <thead><tr className="bg-gray-50 border-b text-sm text-gray-500 font-bold"><th className="py-4 px-6">보안 파일명</th><th className="py-4 px-6">업로드 일자</th><th className="py-4 px-6 text-right">기능</th></tr></thead>
                                <tbody>
                                    {files.map((file) => (
                                        <tr key={file.id} className="border-b hover:bg-blue-50/30">
                                            <td className="py-4 px-6 font-bold text-gray-900 flex items-center gap-3"><FileText size={20} className="text-[#0b2b5e]" /> {file.name}</td>
                                            <td className="py-4 px-6 text-sm text-gray-600">{file.date}</td>
                                            <td className="py-4 px-6 text-right"><button onClick={() => handleDownload(file)} className="text-[#0b2b5e] bg-blue-50 hover:bg-[#0b2b5e] hover:text-white px-4 py-2 rounded-lg text-sm font-bold inline-flex items-center gap-2"><Download size={16}/> 다운로드</button></td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    ) : (<div className="bg-gray-50 border-2 border-dashed border-gray-300 rounded-3xl p-16 flex flex-col items-center justify-center text-center"><Folder size={64} className="text-gray-300 mb-4" /><h3 className="text-xl font-extrabold text-gray-800">보관된 자료가 없습니다</h3></div>)}
                </div>
            );
        };

        const CompanyDashboard = ({ currentUser, handleLogout, showToast }) => {
            const [activeFolderId, setActiveFolderId] = useState(null);
            
            return (
                <div className="flex h-screen bg-gray-50 w-full animate-in fade-in duration-500">
                    {/* White Sidebar */}
                    <aside className="w-72 bg-white border-r border-gray-200 text-gray-700 flex flex-col shadow-sm z-20 shrink-0">
                        <div className="h-20 flex items-center px-6 border-b border-gray-200 bg-white">
                            <ShieldCheck size={28} className="text-[#0b2b5e] mr-3 shrink-0" />
                            <h1 className="font-extrabold text-lg tracking-tight text-[#0b2b5e] leading-tight">경남지역본부<br/><span className="text-[10px] text-blue-500 font-mono tracking-widest font-bold">DATA CENTER</span></h1>
                        </div>
                        <div className="p-4 flex-1 overflow-y-auto">
                            <p className="text-xs font-bold text-gray-400 mb-3 px-2 tracking-wider">메인 메뉴</p>
                            <nav className="space-y-1 mb-8">
                                <button onClick={() => setActiveFolderId(null)} className={`w-full flex items-center gap-3 px-3 py-3 rounded-xl text-sm font-bold transition-all ${!activeFolderId ? 'bg-blue-50 text-[#0b2b5e]' : 'text-gray-600 hover:bg-gray-50'}`}><Home size={18} /> 대시보드 홈</button>
                                {currentUser.folders.map(f => (
                                    <button key={f.id} onClick={() => setActiveFolderId(f.id)} className={`w-full flex items-center gap-3 px-3 py-3 rounded-xl text-sm font-bold transition-all ${activeFolderId === f.id ? 'bg-blue-50 text-[#0b2b5e]' : 'text-gray-600 hover:bg-gray-50'}`}><Folder size={18} /> <span className="truncate">{f.name}</span></button>
                                ))}
                            </nav>
                            <p className="text-xs font-bold text-gray-400 mb-3 px-2 tracking-wider">현장 공유 시스템</p>
                            <nav className="space-y-1">
                                <button onClick={() => showToast('테스트 중인 메뉴입니다. 추후 오픈 예정입니다.')} className={`w-full flex items-center gap-3 px-3 py-3 rounded-xl text-sm font-bold transition-all text-gray-400 hover:bg-gray-50 cursor-not-allowed`}>
                                    <Lock size={18} className="shrink-0" /> 
                                    <span className="truncate text-left leading-tight">MSDS보관함(QR공유)<br/><span className="text-[10px] text-red-400 font-bold">테스트중</span></span>
                                </button>
                            </nav>
                        </div>
                        <div className="p-4 border-t border-gray-200 bg-white">
                            <div className="bg-gray-50 p-3 rounded-xl mb-3 border border-gray-200">
                                <p className="text-[10px] text-gray-500 font-bold mb-1">접속 회원사</p>
                                <p className="text-sm font-bold text-gray-800 truncate">{currentUser.name}</p>
                                <p className="text-xs font-mono text-gray-500 mt-0.5">{currentUser.authInfo.businessNumber}</p>
                            </div>
                            <button onClick={handleLogout} className="w-full flex items-center justify-center gap-2 px-4 py-2.5 rounded-lg text-sm font-bold text-gray-500 hover:bg-red-50 hover:text-red-600 transition-colors"><LogOut size={16} /> 로그아웃</button>
                        </div>
                    </aside>

                    <div className="flex-1 flex flex-col h-screen overflow-hidden bg-gray-50 relative">
                        <header className="h-20 bg-white border-b border-gray-200 flex items-center justify-between px-8 z-10 shadow-sm">
                            <h2 className="text-xl font-extrabold text-gray-800 flex items-center gap-2">
                                {!activeFolderId && <><Home size={22} className="text-gray-400"/> 산업보건 데이터 센터 홈</>}
                                {activeFolderId && <><Folder size={22} className="text-[#0b2b5e]"/> {currentUser.folders.find(f => f.id === activeFolderId)?.name}</>}
                            </h2>
                        </header>
                        <main className="flex-1 overflow-y-auto p-10 relative">
                            <div className="max-w-6xl mx-auto">
                                {!activeFolderId && <CompanyHome companyData={currentUser} setActiveFolderId={setActiveFolderId} />}
                                {activeFolderId && <CompanyFolderView companyData={currentUser} activeFolderId={activeFolderId} setActiveFolderId={setActiveFolderId} showToast={showToast} />}
                            </div>
                        </main>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [appState, setAppState] = useState('LOGIN'); 
            const [currentUser, setCurrentUser] = useState(null); 
            const [db, setDb] = useState(generateEnterpriseDatabase(1)); 
            const [toastMessage, setToastMessage] = useState("");
            const [accessLogs, setAccessLogs] = useState([]); // 접속 로그 상태 추가
            
            const showToast = (msg) => { setToastMessage(msg); setTimeout(() => setToastMessage(""), 3000); };
            const handleLogout = () => { setCurrentUser(null); setAppState('LOGIN'); showToast("안전하게 로그아웃 되었습니다."); };
            const handleUpdateDb = (newDb) => { setDb(newDb); };

            return (
                <div className="h-screen w-full font-sans overflow-hidden bg-gray-100">
                    {toastMessage && (
                        <div className="fixed top-8 left-1/2 transform -translate-x-1/2 z-[100] bg-gray-900/95 text-white px-6 py-4 rounded-2xl shadow-2xl flex items-center gap-3 animate-in slide-in-from-top-6">
                            <CheckCircle size={20} className="text-green-400 shrink-0" />
                            <span className="text-sm font-bold tracking-wide">{toastMessage}</span>
                        </div>
                    )}
                    {appState === 'LOGIN' && <LoginScreen db={db} setCurrentUser={setCurrentUser} setAppState={setAppState} showToast={showToast} setAccessLogs={setAccessLogs} />}
                    {appState === 'ADMIN' && <AdminDashboard db={db} handleUpdateDb={handleUpdateDb} handleLogout={handleLogout} showToast={showToast} accessLogs={accessLogs} setAccessLogs={setAccessLogs} />}
                    {appState === 'COMPANY' && <CompanyDashboard currentUser={currentUser} handleLogout={handleLogout} showToast={showToast} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
